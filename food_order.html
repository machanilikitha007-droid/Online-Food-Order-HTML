<!DOCTYPE html>
<html>
<head>
    <title>Online Food Order</title>
</head>
<body>

    <h1>Online Food Order</h1>

    <p>Choose your favourite food and place your order.</p>

    <form>

        <h2>Customer Details</h2>

        <label>Name:</label>
        <input type="text" required>
        <br><br>

        <label>Phone:</label>
        <input type="tel" required>
        <br><br>

        <label>Address:</label>
        <br>
        <textarea rows="4" cols="35" required></textarea>
        <br><br>

        <h2>Select Food</h2>

        <input type="checkbox"> Pizza - ₹200
        <br>
        <input type="checkbox"> Burger - ₹120
        <br>
        <input type="checkbox"> Fried Rice - ₹150
        <br>
        <input type="checkbox"> Sandwich - ₹100
        <br>
        <input type="checkbox"> Ice Cream - ₹80
        <br><br>

        <label>Quantity:</label>
        <input type="number" min="1" value="1">
        <br><br>

        <label>Payment Method:</label>
        <select>
            <option>Cash on Delivery</option>
            <option>UPI</option>
            <option>Debit Card</option>
            <option>Credit Card</option>
        </select>
        <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear">

    </form>

    <p><b>Author:</b> M.Likitha</p>

</body>
</html>
